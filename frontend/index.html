    <style>
      /* ================================================================
         SCROLLBAR — Luxury Detective (gold on dark)
         ================================================================ */
      ::-webkit-scrollbar { width: 10px; height: 10px; }
      ::-webkit-scrollbar-track { background: #000C16; border-radius: 10px; }
      ::-webkit-scrollbar-thumb {
        background: linear-gradient(180deg, #FFD36D 0%, #F6C55D 50%, #B77B32 100%);
        border-radius: 10px;
        border: 2px solid #000C16;

      }

      * { scrollbar-width: thin; scrollbar-color: #F6C55D #000C16; }

      html { scroll-behavior: smooth; }

      /* ================================================================
         PAGE BASE + GLOBAL FONTS
         ================================================================ */
      html, body {
        background: #000C16;
        color: #F5F5F3;
        font-family: 'Inter', sans-serif;
      }

      /* ================================================================
         🔤 PLAYFAIR DISPLAY — GLOBAL HEADING FONT
         Applied to all headings unless explicitly overridden
         ================================================================ */
      h1, h2, h3, h4, h5, h6,
      .heading, .heading-1, .heading-2, .heading-3,
      .mm-serif, .mm-heading, .font-heading {
        font-family: "'Playfair Display', Georgia, serif" !important;
      }

      /* Optional: refine heading weight/letter-spacing globally */
      h1, h2, h3, h4, h5, h6 {
        font-weight: 600;
        letter-spacing: -0.3px;
      }

      h1 { font-weight: 700; }
      h2 { font-weight: 700; }
      h3 { font-weight: 600; }

      /* Text-like non-heading blocks that you might want serif too */
      blockquote, .serif {
        font-family: "'Playfair Display', Georgia, serif";
      }

      /* Body paragraphs stay Inter */
      p, span, a, li, div, label, input, textarea, select, button {
        font-family: inherit;
      }

      /* Gradient text — gold */
      .gradient-text {
        background: linear-gradient(90deg, #FFD36D, #F6C55D, #B77B32);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }

      /* Primary gradient — gold */
      .gradient-primary {
        background: linear-gradient(135deg, #FFD36D 0%, #F6C55D 50%, #B77B32 100%);
      }

      /* Soft radial glow background */
      .gradient-bg {
        background:
          radial-gradient(circle at 65% 15%, rgba(246,197,93,.10), transparent 32%),
          radial-gradient(circle at 20% 80%, rgba(0,16,26,.55), transparent 40%),
          #000C16;
      }

      /* Loader */
      .loader {
        border: 3px solid rgba(246,197,93,.2);
        border-top: 3px solid #F6C55D;
        border-radius: 50%;
        width: 40px;
        height: 40px;
        animation: spin 1s linear infinite;
      }
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }

      .card-hover { transition: all 0.3s ease; }
      .card-hover:hover {
        transform: translateY(-5px);
        box-shadow: 0 20px 25px -5px rgba(246,197,93,.18),
                    0 10px 10px -5px rgba(183,123,50,.12);
      }

      .accent-glow { box-shadow: 0 0 30px rgba(246,197,93,.25); }
      .accent-glow:hover { box-shadow: 0 0 50px rgba(246,197,93,.4); }

      .bg-grid-pattern {
        background-image:
          linear-gradient(rgba(246,197,93,0.05) 1px, transparent 1px),
          linear-gradient(90deg, rgba(246,197,93,0.05) 1px, transparent 1px);
        background-size: 30px 30px;
      }
    </style>
